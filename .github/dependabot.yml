# 의존성 업데이트 PR 자동 생성 (dev 브랜치로). Electron 은 Chromium 보안 패치가 자주 나오므로 따로 묶어 빨리 받는다.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      electron:
        patterns: ["electron", "electron-builder", "electron-updater", "electron-vite"]
      dev-tools:
        dependency-type: development
        exclude-patterns: ["electron", "electron-builder", "electron-vite"]
      runtime:
        dependency-type: production
        exclude-patterns: ["electron-updater"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
