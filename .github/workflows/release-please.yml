# 버전 · CHANGELOG 자동화 (release-please): main 에 커밋이 쌓이면 "chore(main): release x.y.z" PR 을 열어 둔다.
#   - 버전은 커밋 메시지로 정한다: fix → 0.1.3, feat → 0.2.0, "!" 또는 BREAKING CHANGE → 다음 큰 버전
#   - PR 에는 package.json 버전 올림과 CHANGELOG.md 가 들어 있다
#   - PR 을 병합하면 태그 + 초안 릴리스(CHANGELOG 내용)가 생기고, 아래 build job 이 release.yml 로 설치 파일을 올린다
name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          # 기본 GITHUB_TOKEN 이 만든 PR 에는 CI 가 돌지 않는다. main 에 "CI 통과 필수" 를 걸었다면
          # 저장소 권한(contents · pull requests)이 있는 토큰을 RELEASE_PLEASE_TOKEN 시크릿으로 넣는다
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # 기본 브랜치가 dev 라도 release PR 은 main 으로 (빠지면 기본 브랜치로 열려 태그가 안 생긴다)
          target-branch: main

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
