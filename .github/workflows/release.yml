# 릴리스 빌드: macOS · Windows · Linux 에서 빌드 → 서명 검증 · 스모크 테스트 → GitHub 초안 릴리스에 올린다.
#
# 보통은 release-please 가 부른다 (release-please.yml): main 의 "chore(main): release x.y.z" PR 을 병합하면
# 태그와 초안 릴리스(CHANGELOG 내용)가 생기고, 이 워크플로가 그 초안에 설치 파일을 올린다.
# 비상용으로 main 의 커밋에 직접 v* 태그를 push 해도 돈다.
# 어느 쪽이든 결과는 "초안" — GitHub Releases 에서 파일을 확인하고 Publish 해야 사용자(랜딩 · 자동 업데이트)에게 보인다.
#
# 인증서가 없으므로 macOS 는 ad-hoc 서명만 한다 (서명이 없으면 "손상됨" 으로 막힌다).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: 빌드할 태그 (예 v0.2.0)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 다시 빌드할 태그 (예 v0.2.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  guard:
    name: 태그 확인 (main · 버전)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 태그 커밋이 main 에 있는지
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$TAG^{commit}" origin/main; then
            echo "::error::$TAG 는 main 에 없는 커밋입니다. dev 를 main 에 병합한 뒤 main 에서 릴리스하세요."
            exit 1
          fi
      - name: 태그와 package.json 버전이 같은지
        run: |
          have="$(git show "$TAG:package.json" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")"
          if [ "${TAG#v}" != "$have" ]; then
            echo "::error::태그 $TAG 와 package.json version $have 이 다릅니다"
            exit 1
          fi

  build:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # 러너에는 git 사용자 설정이 없다 (테스트 · 스모크용 임시 저장소의 커밋 작성자)
      - run: git config --global user.name CI && git config --global user.email ci@example.com

      - name: 테스트 (한 번만 · Linux)
        if: runner.os == 'Linux'
        run: npm test

      - name: 빌드 (올리지는 않음 — 마지막 job 이 한 번에 올린다)
        run: npx electron-vite build && npx electron-builder --config electron-builder.config.cjs ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # 러너에 인증서가 없다: 키체인에서 찾지 않음
          YGG_ADHOC_SIGN: "1" # 대신 macOS 는 ad-hoc 서명 (서명이 없으면 "손상됨" 으로 막힌다)

      - name: 서명 검증 (macOS — 서명이 앱 내용과 맞는지)
        if: runner.os == 'macOS'
        run: |
          for app in dist/mac*/Yggdrasil.app; do
            echo "== $app"
            codesign --verify --deep --strict --verbose=2 "$app"
          done

      # 빌드한 실제 앱을 켜서 저장소를 열어 본다 (Linux 는 화면이 없어 가상 화면 위에서)
      - name: 스모크 테스트 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run --auto-servernum -- node scripts/smoke-packaged.mjs
      - name: 스모크 테스트 (macOS · Windows)
        if: runner.os != 'Linux'
        run: node scripts/smoke-packaged.mjs

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ runner.os }}
          if-no-files-found: error
          path: |
            dist/Yggdrasil-*
            dist/latest*.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # 릴리스 만들기 · 파일 올리기 (GITHUB_TOKEN)
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: 체크섬 (SHA256SUMS.txt)
        working-directory: dist
        run: |
          sha256sum Yggdrasil-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # release-please 가 이미 만든 초안이 있으면 거기에 올리고, 없으면(태그를 직접 push) 초안을 새로 만든다.
      # 새로 만들 때 본문 맨 위 = 태그 메시지(git tag -a v0.2.0 -m "한 줄 요약"), 그 아래 커밋 목록.
      - name: 초안 릴리스에 올리기
        run: |
          files=(dist/Yggdrasil-* dist/latest*.yml dist/SHA256SUMS.txt)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")"
            : > notes.md
            if [ "$(echo "$ref" | jq -r .object.type)" = "tag" ]; then
              gh api "repos/$GITHUB_REPOSITORY/git/tags/$(echo "$ref" | jq -r .object.sha)" --jq .message \
                | sed '/^-----BEGIN PGP SIGNATURE-----/,$d' > notes.md
            fi
            gh release create "$TAG" "${files[@]}" --draft --title "Yggdrasil $TAG" \
              --notes-file notes.md --generate-notes --repo "$GITHUB_REPOSITORY"
          fi

      - name: 다음 할 일
        run: echo "::notice::$TAG 초안 릴리스에 파일을 올렸습니다. GitHub Releases 에서 확인하고 Publish 하세요."
