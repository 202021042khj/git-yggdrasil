# 릴리스: v로 시작하는 태그(v0.2.0 등)를 push 하면 macOS · Windows · Linux 에서 각각 빌드해
# GitHub Releases 에 올린다. 랜딩 페이지의 releases/latest/download/<파일> 링크가 이 파일들을 가리킨다.
#
#   1) package.json 의 "version" 을 올리고 커밋
#   2) git tag v0.2.0 && git push origin v0.2.0
#
# 인증서가 없으므로 서명 · 공증 없이 만든다 (다운로드 페이지가 첫 실행 방법을 안내한다).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # Actions 탭에서 손으로 다시 돌릴 때 (태그를 골라 실행)

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: 태그와 package.json 버전이 같은지 확인
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(node -p "require('./package.json').version")"
          if [ "$want" != "$have" ]; then
            echo "::error::태그 $GITHUB_REF_NAME 와 package.json version $have 이 다릅니다"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: 테스트 (한 번만 · Linux)
        if: runner.os == 'Linux'
        run: npm test

      - name: 빌드 (올리지는 않음 — 마지막 job 이 한 번에 올린다)
        run: npx electron-vite build && npx electron-builder --config electron-builder.config.cjs ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # 러너에 인증서가 없다: 서명 시도하지 않음

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ runner.os }}
          if-no-files-found: error
          path: |
            dist/Yggdrasil-*
            dist/latest*.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # 릴리스 만들기 · 파일 올리기 (GITHUB_TOKEN, 따로 토큰 필요 없음)
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - run: ls -la dist

      # 릴리스 본문 맨 위 = 태그 메시지 (git tag -a v0.2.0 -m "한 줄 요약" 으로 만든 태그).
      # 첫 줄이 랜딩 페이지 "릴리스 노트" 의 요약으로 쓰인다. 메시지 없는 태그면 비워 두고 자동 노트만 붙는다.
      - name: 태그 메시지 읽기
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}")"
          : > notes.md
          if [ "$(echo "$ref" | jq -r .object.type)" = "tag" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/git/tags/$(echo "$ref" | jq -r .object.sha)" --jq .message \
              | sed '/^-----BEGIN PGP SIGNATURE-----/,$d' > notes.md
          fi
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Yggdrasil ${{ github.ref_name }}
          body_path: notes.md
          generate_release_notes: true # 태그 메시지 아래에 커밋 · PR 목록을 덧붙인다
          fail_on_unmatched_files: true
          files: |
            dist/Yggdrasil-*
            dist/latest*.yml
