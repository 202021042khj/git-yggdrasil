# CI: 모든 브랜치의 push 와 PR 에서 타입 검사 · lint · 단위 테스트 · E2E 를 돌린다.
# (릴리스 빌드는 release.yml — v* 태그를 push 할 때만)
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

# 같은 브랜치에 새로 push 하면 앞서 돌던 실행은 취소한다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 타입 · lint · 단위 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 러너에는 git 사용자 설정이 없다: 기본값만 둔다 (테스트는 저장소마다 user.name 을 따로 정하고, 그 값이 이긴다.
      # GIT_AUTHOR_* 환경 변수는 저장소 설정까지 덮어써서 작성자를 확인하는 테스트가 깨지므로 쓰지 않는다)
      - run: git config --global user.name CI && git config --global user.email ci@example.com
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  e2e:
    name: E2E (Electron)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 러너에는 git 사용자 설정이 없다: 기본값만 둔다 (테스트는 저장소마다 user.name 을 따로 정하고, 그 값이 이긴다.
      # GIT_AUTHOR_* 환경 변수는 저장소 설정까지 덮어써서 작성자를 확인하는 테스트가 깨지므로 쓰지 않는다)
      - run: git config --global user.name CI && git config --global user.email ci@example.com
      - run: npx electron-vite build
      # Ubuntu 24.04 는 Chromium 샌드박스에 필요한 사용자 이름공간을 막아 둔다 (앱의 sandbox: true 를 그대로 시험하려고 푼다)
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # 화면이 없는 러너라 가상 화면(xvfb) 위에서 Electron 을 띄운다
      - run: xvfb-run --auto-servernum -- npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
